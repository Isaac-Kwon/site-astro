name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Every URL the Jekyll site served must exist. Drop --allow-missing once
      # all posts and pages are migrated.
      - run: npm run check:urls -- --allow-missing
